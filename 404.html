<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije nađena — Konus Konex</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F2EEE6;--ink:#17130F;--ink-soft:#57534C;--line:#DAD3C6;--accent:#2F6B4F;--accent-strong:#265741}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
    font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);
    background-color:var(--paper);
    background-image:linear-gradient(rgba(23,19,15,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(23,19,15,.035) 1px,transparent 1px);
    background-size:44px 44px}
  main{max-width:56ch}
  .eyebrow{font:500 12px 'IBM Plex Mono';letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  h1{font:800 clamp(32px,6vw,64px)/1 'Archivo';letter-spacing:-.03em;margin:0 0 18px}
  p{font:400 17px/1.6 'IBM Plex Sans';color:var(--ink-soft);margin:0 0 28px}
  .row{display:flex;flex-wrap:wrap;gap:14px}
  a.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;font:600 15px 'IBM Plex Sans';
    padding:15px 26px;min-height:44px;text-decoration:none;transition:background .18s}
  a.btn:hover{background:var(--accent-strong)}
  a.ghost{display:inline-flex;align-items:center;gap:10px;background:transparent;color:var(--ink);font:600 15px 'IBM Plex Sans';
    padding:15px 26px;min-height:44px;border:1.5px solid var(--ink);text-decoration:none}
  a.ghost:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Greška 404</div>
  <h1>Stranica nije nađena.</h1>
  <p>Adresa je možda promenjena ili pogrešno upisana. Vratite se na početnu ili nam pišite — rado pomažemo.</p>
  <div class="row">
    <a class="btn" href="/">Na početnu</a>
    <a class="ghost" href="/kontakti">Kontakti</a>
  </div>
</main>
</body>
</html>
