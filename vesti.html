<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2F6B4F&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#E0511E&quot;,&quot;#1F5FA8&quot;,&quot;#2F6B4F&quot;,&quot;#B0842A&quot;],&quot;section&quot;:&quot;Izgled&quot;},&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;SRB&quot;,&quot;options&quot;:[&quot;SLO&quot;,&quot;ENG&quot;,&quot;SRB&quot;,&quot;RUS&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sadržaj&quot;}}">
class Component extends DCLogic {
  componentDidMount(){ this.applyAccent(); }
  componentDidUpdate(prev){ if(prev.accentColor!==this.props.accentColor) this.applyAccent(); }
  applyAccent(){ const a=this.props.accentColor, r=document.documentElement; if(a){ r.style.setProperty('--accent',a); r.style.setProperty('--accent-strong', this.shade(a,-0.16)); } }
  shade(hex,amt){ let h=String(hex).replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16), r=(n>>16)&255, g=(n>>8)&255, b=n&255, f=c=>Math.max(0,Math.min(255,Math.round(c*(1+amt)))); return '#'+[f(r),f(g),f(b)].map(c=>c.toString(16).padStart(2,'0')).join(''); }
  renderVals(){ return {}; }
}
</script>
